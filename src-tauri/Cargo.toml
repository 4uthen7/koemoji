[package]
name = "koemoji"
version = "0.1.0"
description = "音声・動画をローカルで文字起こしするデスクトップアプリ"
edition = "2021"

[lib]
name = "koemoji_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
] }
symphonia = { version = "0.5", features = ["all"] }
whisper-rs = { version = "0.16", features = ["cuda"] }

# GPU アクセラレーション: デフォルトで CUDA (NVIDIA) 有効
# CPU のみで動かす場合は features = [] に。macOS は features = ["metal"] に変更

[profile.release]
lto = true
codegen-units = 1
strip = true
